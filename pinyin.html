<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>聽聲音拼注音</title>
<style>
:root{--green:#b6d46b;--blue:#cfe8fb;--blueD:#5aa6dc;--pink:#fbd5e0;--pinkD:#e27a9a;--ink:#2b2a35;--ok:#2fb36d;--bad:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:"PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
button{font:inherit;border:0;cursor:pointer}
.top{background:var(--green);padding:18px 16px 14px;display:flex;align-items:center;justify-content:center;gap:28px;position:relative;min-height:330px}
.side{position:absolute;left:16px;top:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.pill{background:#fff;border-radius:999px;padding:4px 14px;font-size:18px}
.hear{background:#fff;border-radius:18px;padding:14px 18px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 3px 0 rgba(0,0,0,.12);font-size:16px}
.hear .ic{width:58px;height:58px;display:block}
.mic img{width:30px;height:30px;display:block;margin:auto}
.lb{border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:20px;min-width:min(460px,92vw)}
.lb th{background:#fde7cf;padding:8px}.lb td{padding:8px;border-top:1px solid #eee}.lb tr.me td{background:#e6f5fc;font-weight:700}
input.name{font:inherit;font-size:24px;padding:10px 14px;border-radius:12px;border:3px solid #ddd;width:min(300px,80vw);text-align:center}
.ghost{background:#fff;font-size:18px;padding:10px 20px;border-radius:14px;border:2px solid #ddd}
.quit{background:#fff;border:2px solid #e57373;color:#c62828;border-radius:14px;padding:8px 14px;font-size:18px}.quit.sure{background:#e57373;color:#fff}
.hear:active{transform:translateY(2px)}
.prog{position:absolute;right:16px;top:18px;display:grid;grid-template-columns:repeat(4,64px);gap:10px}
.menu{display:grid;grid-template-columns:repeat(4,130px);gap:16px;margin:10px 0}
.lvb{background:#fff;border-radius:18px;box-shadow:0 4px 0 rgba(0,0,0,.15);padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:20px;font-weight:700;color:var(--ink)}
.lvb img{width:84px;height:84px;object-fit:contain}
.lvb .lk{width:84px;height:84px;display:flex;align-items:center;justify-content:center;font-size:44px}
.lvb.locked{opacity:.45;cursor:not-allowed}
.lvb.next{outline:4px solid #ff8a3d}
.lbw{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
@media (max-width:640px){.menu{grid-template-columns:repeat(2,130px)}}
.gift{width:64px;height:64px;border-radius:14px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;padding:4px;position:relative}
.gift img{max-width:100%;max-height:100%}
.gift.cur{outline:4px solid #ff8a3d}
.gift .n{position:absolute;left:4px;top:1px;font-size:12px;color:#888}
.got{width:140px;height:140px;object-fit:contain}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.pop{animation:pop .6s}
.mid{display:flex;flex-direction:column;align-items:center;gap:8px}
.card{width:250px;background:#fff;border-radius:6px;box-shadow:0 4px 0 rgba(0,0,0,.15);overflow:hidden}
.cell{height:150px;padding-top:0;position:relative;display:flex;align-items:center;justify-content:center}
.cell.s{background:var(--blue)} .cell.y{background:var(--pink);border-top:2px solid #fff}
.cell .lab{display:none;position:absolute;left:10px;top:6px;font-size:15px;color:#555}
.sym{font-size:96px;line-height:1}
.slot{width:110px;height:110px;border:4px dashed rgba(0,0,0,.25);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:96px;line-height:1;color:#999;background:rgba(255,255,255,.6)}
.slot.ok{border-color:var(--ok);color:var(--ok);background:#effaf3}
.slot.bad{animation:sh .35s;border-color:var(--bad)}
.mic{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;background:#fff;font-size:22px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.mic:active{transform:scale(.92)}
.task{position:absolute;right:16px;top:92px;background:#fff;border-radius:14px;padding:8px 14px;font-size:17px;max-width:220px;line-height:1.5}
.res{text-align:center;font-size:28px;font-weight:700;min-height:38px}
.cell.y{height:190px}
.tm.low{background:#fde2e2;color:var(--bad);font-weight:700}
.kb{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;max-width:860px;margin:12px auto;padding:0 12px}
.k{aspect-ratio:auto;height:clamp(46px,calc((100vh - 540px)/4 - 6px),84px);border-radius:10px;font-size:clamp(26px,5vw,48px);line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.25);color:#3a2a1a}
.k.s{background:var(--blue)} .k.y{background:var(--pink)}
.k:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.k.bad{animation:sh .35s;background:#f8b4b6}
.k.gap{visibility:hidden}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.screen{position:fixed;inset:0;background:rgba(182,212,107,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;z-index:5}
.screen h1{margin:0;font-size:36px}
.big{background:#ff8a3d;color:#fff;font-size:28px;font-weight:700;padding:14px 40px;border-radius:16px;box-shadow:0 4px 0 #d96a22}
.hide{display:none}
@media (max-width:760px){.prog{position:static;grid-template-columns:repeat(4,52px);gap:8px}.gift{width:52px;height:52px}.top{flex-direction:column;padding-top:16px!important;gap:12px}.side{position:static;flex-direction:row;align-items:center;flex-wrap:wrap;justify-content:center}.hear{flex-direction:row;padding:8px 14px}.hear .ic{width:40px;height:40px}.task{position:static;max-width:none;text-align:center}.res{position:static;height:auto;min-height:34px}}
</style>
</head>
<body>
<div class="top">
  <div class="prog" id="prog"></div>
  <div class="side">
    <span class="pill" id="lv">第 1 關</span><span class="pill" id="pg">第 1 / 6 題</span><span class="pill tm" id="tm">⏱ 1:20</span>
    <button class="hear" id="again"><img class="ic" src="" alt="">再聽一次</button>
    <button class="quit" id="quit">⏹ 中止</button>
  </div>
  <div class="mid">
  <div class="card">
    <div class="cell s" id="cS"><span class="lab">聲符</span></div>
    <div class="cell y" id="cY"><span class="lab">韻母／結合韻</span></div>
  </div>
  <div class="res" id="res"></div>
  </div>
  <div class="task" id="task" style="display:none"></div>
</div>
<div class="kb" id="kb"></div>

<div class="screen hide" id="menu"><h1>選一關</h1><div id="menuWho" style="font-size:20px"></div><div class="menu" id="menuGrid"></div><button class="ghost" id="menuChg">換人</button></div>
<div class="screen" id="start"><h1>聽聲音，拼注音</h1><div style="font-size:20px">聽一聽，按下面的注音，把缺少的部分補上</div><div id="who"></div></div>
<div class="screen hide" id="end" style="overflow:auto;padding:20px 0"><h1 id="endT">過關了！🎉</h1><div id="gotBox"></div><div style="font-size:28px" id="score"></div><div style="font-size:20px" id="time"></div><div id="lbBox"></div><button class="big" id="re">🔄 再玩一次</button><button class="big hide" id="nx" style="background:#3fa7d6;box-shadow:0 4px 0 #2b7fa8">下一關 ▶</button><button class="ghost" id="toMenu">📋 選關</button></div>
<div class="screen hide" id="fail"><h1>時間到！⏰</h1><div style="font-size:24px" id="failMsg"></div><button class="big" id="retry">🔄 再來一次</button></div>

 [{t:'y',s:'ㄇ',y:'ㄚ',w:'',a:'ma'},{t:'y',s:'ㄇ',y:'ㄛ',w:'',a:'mo'},{t:'y',s:'ㄇ',y:'ㄞ',w:'',a:'mai'},{t:'y',s:'ㄇ',y:'ㄢ',w:'',a:'man'},{t:'y',s:'ㄇ',y:'ㄣ',w:'',a:'men'},{t:'y',s:'ㄇ',y:'ㄤ',w:'',a:'mang'}],
 [{t:'s',s:'ㄅ',y:'ㄛ',w:'',a:'bo'},{t:'s',s:'ㄆ',y:'ㄛ',w:'',a:'po'},{t:'s',s:'ㄉ',y:'ㄜ',w:'',a:'de'},{t:'s',s:'ㄍ',y:'ㄜ',w:'',a:'ge'},{t:'s',s:'ㄎ',y:'ㄜ',w:'',a:'ke'},{t:'s',s:'ㄏ',y:'ㄜ',w:'',a:'he'}],
 [{t:'y',s:'ㄉ',y:'ㄚ',w:'',a:'da'},{t:'y',s:'ㄉ',y:'ㄜ',w:'',a:'de'},{t:'y',s:'ㄉ',y:'ㄞ',w:'',a:'dai'},{t:'y',s:'ㄉ',y:'ㄠ',w:'',a:'dao'},{t:'y',s:'ㄉ',y:'ㄡ',w:'',a:'dou'},{t:'y',s:'ㄉ',y:'ㄢ',w:'',a:'dan'}],
 [{t:'s',s:'ㄆ',y:'ㄞ',w:'',a:'pai'},{t:'s',s:'ㄉ',y:'ㄞ',w:'',a:'dai'},{t:'s',s:'ㄊ',y:'ㄞ',w:'',a:'tai'},{t:'s',s:'ㄌ',y:'ㄞ',w:'',a:'lai'},{t:'s',s:'ㄎ',y:'ㄞ',w:'',a:'kai'},{t:'s',s:'ㄗ',y:'ㄞ',w:'',a:'zai'}],
 [{t:'y',s:'ㄌ',y:'ㄚ',w:'',a:'la'},{t:'y',s:'ㄌ',y:'ㄜ',w:'',a:'le'},{t:'y',s:'ㄌ',y:'ㄞ',w:'',a:'lai'},{t:'y',s:'ㄌ',y:'ㄠ',w:'',a:'lao'},{t:'y',s:'ㄌ',y:'ㄡ',w:'',a:'lou'},{t:'y',s:'ㄌ',y:'ㄢ',w:'',a:'lan'}]
];
var LIMIT=80;           // 每一關的時限（秒）
var L=0, Q=LEVELS[0];
var SYM={};'ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦㄧㄨㄩ'.split('').forEach(function(c){SYM[c]='sym_'+c});  // 喇叭：唸出注音符號
var ROWS=['ㄦㄢㄞㄚㄗㄓㄐㄍㄉㄅ','ㄧㄣㄟㄛㄘㄔㄑㄎㄊㄆ','ㄨㄤㄠㄜㄙㄕㄒㄏㄋㄇ','ㄩㄥㄡㄝ ㄖ  ㄌㄈ'];
var INIT='ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ';
var i=0, firstTry=0, missed=false, busy=false, cur=null, NAME='', t0=0, tid=null, over=false, late=false;
function shuffle(a){for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function setId(){return 'PY-'+(L+1)}
var NLEV=8;  // 8 個禮物格子（上排 4、下排 4）
function passedKey(){return 'pyPassed.'+NAME.toLowerCase()}
function getPassed(){try{return JSON.parse(localStorage.getItem(passedKey())||'[]')}catch(e){return []}}
function setPassed(a){try{localStorage.setItem(passedKey(),JSON.stringify(a))}catch(e){}}
function drawProg(popIdx){
  var got=getPassed(), h='';
  for(var k=0;k<NLEV;k++){ var on=got.indexOf(k)>=0;
    h+='<div class="gift'+(k===L?' cur':'')+'" title="第 '+(k+1)+' 關"><span class="n">'+(k+1)+'</span><img class="'+(k===popIdx?'pop':'')+'" src="'+(on?REW[k]:GIFT)+'" alt=""></div>'; }
  $('prog').innerHTML=h;
}
function $(id){return document.getElementById(id)}
var AU=null;
function play(k,done){try{ if(!AU) AU=new Audio(); AU.onended=null; AU.onerror=null; AU.pause(); cur=AU; var fired=false,fin=function(){if(fired)return;fired=true;done&&done()}; AU.src=A[k]; AU.onended=fin; AU.onerror=fin; var pr=AU.play(); if(pr&&pr.catch) pr.catch(fin); if(done) setTimeout(fin,4000)}catch(e){done&&done()}}
function seq(list,done){ if(!list.length){done&&done();return} play(list[0],function(){setTimeout(function(){seq(list.slice(1),done)},40)}) }
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function fmt(x){x=Math.round(x);return Math.floor(x/60)+':'+('0'+x%60).slice(-2)}
function getName(){try{return localStorage.getItem(NAME_KEY)||''}catch(e){return ''}}
function saveName(n){try{localStorage.setItem(NAME_KEY,n)}catch(e){}}
function micBtn(sym){var b=document.createElement('button');b.className='mic';b.innerHTML='<img src="'+ICON+'" alt="">';b.setAttribute('aria-label','聽 '+sym);b.onclick=function(){play(SYM[sym])};return b}
function setCell(el,lab,content){el.innerHTML='<span class="lab">'+lab+'</span>';el.appendChild(content)}
function symEl(t){var d=document.createElement('span');d.className='sym';d.textContent=t;return d}
function slotEl(){var d=document.createElement('div');d.className='slot';d.id='slot';d.textContent='？';return d}
function show(){
  var q=Q[i]; missed=false; busy=false; $('res').textContent='';
  $('pg').textContent='第 '+(i+1)+' / '+Q.length+' 題';
  if(q.t==='s'){
    setCell($('cS'),'聲符',slotEl());
    setCell($('cY'),'韻母／結合韻',symEl(q.y)); if(SYM[q.y]) $('cY').appendChild(micBtn(q.y));
    $('task').innerHTML='<b>換聲符</b><br>韻母「'+q.y+'」不變，<br>按下面的<span style="background:var(--blue);padding:0 4px;border-radius:4px">聲符</span>';
  }else{
    setCell($('cS'),'聲符',symEl(q.s)); if(SYM[q.s]) $('cS').appendChild(micBtn(q.s));
    setCell($('cY'),'韻母／結合韻',slotEl());
    $('task').innerHTML='<b>換韻母</b><br>聲符「'+q.s+'」不變，<br>按下面的<span style="background:var(--pink);padding:0 4px;border-radius:4px">韻母</span>';
  }
  setTimeout(function(){play(q.a)},300);
}
function press(k,btn){
  if(busy||over) return; var q=Q[i], want=q.t==='s'?q.s:q.y, slot=$('slot'); play(SYM[k]);
  if(k===want){
    busy=true; slot.textContent=k; slot.classList.add('ok'); if(!missed) firstTry++;
    $('res').innerHTML='<span style="color:var(--ok)">✓ '+q.s+q.y+(q.w?'（'+q.w+'）':'')+'</span>';
    var next=function(){ if(over) return; i++; if(i<Q.length) show(); else finish(); };
    // 換聲符：按下的聲符（已播）→ 韻母 → 整個字 → 答對音效
    // 換韻母：按下的韻母（已播）→ 聲符 → 韻母 → 整個字 → 答對音效
    var list=q.t==='s'?[SYM[q.y], q.a, 'ding']:[SYM[q.s], SYM[q.y], q.a, 'ding'];
    setTimeout(function(){ seq(list, function(){ setTimeout(next,500) }) },700);
  }else{
    missed=true; btn.classList.remove('bad'); void btn.offsetWidth; btn.classList.add('bad'); setTimeout(function(){btn.classList.remove('bad')},450);
    slot.classList.remove('bad'); void slot.offsetWidth; slot.classList.add('bad');
    $('res').innerHTML='<span style="color:var(--bad)">再聽一次，試試看！</span>';
    setTimeout(function(){play(q.a)},1000);
  }
}
function finish(){
  clearInterval(tid); over=true; var sec=(Date.now()-t0)/1000;
  var passed=(firstTry===Q.length) && !late && sec<=LIMIT;
  $('nx').classList.toggle('hide', !(passed && LEVELS[L+1]));
  $('endT').textContent=passed?'過關了！🎉':'差一點點！';
  $('re').textContent=passed?'🔄 再玩一次':'🔄 再來一次';
  if(!passed){ drawProg(-1); var why=[]; if(firstTry<Q.length) why.push('每一題都要第一次就答對'); if(late||sec>LIMIT) why.push('要在 '+fmt(LIMIT)+' 內完成');
    $('gotBox').innerHTML='<div style="font-size:22px">'+why.join('，還')+'，才能過關喔！</div>'; }
  else { var got=getPassed(), first=got.indexOf(L)<0; if(first){got.push(L); setPassed(got)} drawProg(first?L:-1);
  $('gotBox').innerHTML='<img class="got pop" src="'+REW[L]+'" alt=""><div style="font-size:22px">'+(first?'你得到第 '+(L+1)+' 個獎勵！':'第 '+(L+1)+' 關的獎勵')+'</div>'; }
  $('score').textContent='第一次就答對 '+firstTry+' / '+Q.length+' 題'; $('time').textContent='用時 '+fmt(sec);
  $('lbBox').innerHTML='<div style="font-size:18px">儲存成績中…</div>'; $('end').classList.remove('hide');
  var u=API+'?api=score&set='+encodeURIComponent(setId())+'&name='+encodeURIComponent(NAME)+'&c='+firstTry+'&n='+Q.length+'&s='+sec.toFixed(1);
  var ok=function(lb){$('lbBox').innerHTML=lbHTML(lb)}, bad=function(){$('lbBox').innerHTML='<div style="color:var(--bad)">成績沒有存到（網路有問題）</div>'};
  if(window.google&&google.script&&google.script.run){ var tries=0; (function send(){ google.script.run.withSuccessHandler(ok).withFailureHandler(function(){ if(++tries<3) setTimeout(send,1500); else bad() }).submitScore(setId(),NAME,firstTry,Q.length,sec) })(); }
  else { var tr2=0; (function go(){ fetch(u).then(function(r){return r.json()}).then(ok).catch(function(){ if(++tr2<3) setTimeout(go,1500); else bad() }) })(); }
}
function lbHTML(lb){
  if(!lb||!lb.top) return '<div>還沒有人上榜</div>';
  var m=NAME.toLowerCase(), md=['🥇','🥈','🥉'];
  var h='<div style="font-size:24px;font-weight:700;margin-bottom:8px">🏆 排行榜</div><table class="lb"><tr><th>名次</th><th>名字</th><th>時間</th></tr>';
  lb.top.slice(0,5).forEach(function(r){h+='<tr class="'+(r.name.toLowerCase()===m?'me':'')+'"><td>'+(r.rank<=3?md[r.rank-1]:r.rank)+'</td><td>'+esc(r.name)+'</td><td>'+fmt(r.s)+'</td></tr>'});
  if(!lb.top.length) h+='<tr><td colspan="3">還沒有人全對上榜</td></tr>';
  h+='</table>'; if(lb.mine&&lb.mine.rank>5) h+='<div style="margin-top:8px">你的最好成績：第 '+lb.mine.rank+' 名</div>';
  h='<div>'+h+'</div>';
  if(lb.recent&&lb.recent.length){
    var r2='<div><div style="font-size:24px;font-weight:700;margin-bottom:8px">🕘 我最近 5 次</div><table class="lb" style="min-width:0"><tr><th>日期</th><th>答對</th><th>時間</th></tr>';
    lb.recent.forEach(function(r){var d=new Date(r.t); r2+='<tr class="'+(String(r.name||'').toLowerCase()===m?'me':'')+'"><td>'+(d.getMonth()+1)+'/'+d.getDate()+' '+d.getHours()+':'+('0'+d.getMinutes()).slice(-2)+'</td><td>'+r.c+' / '+r.n+'</td><td>'+fmt(r.s)+'</td></tr>'});
    h+=r2+'</table></div>';
  }
  return '<div class="lbw">'+h+'</div>';
}
function tick(){
  var left=LIMIT-(Date.now()-t0)/1000;
  if(left>0){ $('tm').textContent='⏱ '+fmt(Math.ceil(left)); }
  else { late=true; $('tm').textContent='⏱ 超時 '+fmt(-left); }   // 超過時間：可以繼續做完，但不能過關
  $('tm').classList.toggle('low', left<=15);
}
function startGame(){ ['start','end','fail','menu'].forEach(function(id){$(id).classList.add('hide')}); Q=shuffle(LEVELS[L].slice()); i=0; firstTry=0; over=false; late=false; t0=Date.now(); $('lv').textContent='第 '+(L+1)+' 關'; drawProg(-1); clearInterval(tid); tid=setInterval(tick,250); tick(); show() }
function unlocked(k,got){ return k===0 || got.indexOf(k-1)>=0 || got.indexOf(k)>=0 }
function showMenu(){
  ['start','end','fail'].forEach(function(id){$(id).classList.add('hide')}); clearInterval(tid); over=true;
  var got=getPassed(), h='', nextL=-1;
  for(var k=0;k<LEVELS.length;k++){ if(got.indexOf(k)<0 && unlocked(k,got)){ nextL=k; break } }
  for(var k=0;k<LEVELS.length;k++){ var on=got.indexOf(k)>=0, ok=unlocked(k,got);
    h+='<button class="lvb'+(ok?'':' locked')+(k===nextL?' next':'')+'" data-k="'+k+'">'+(on?'<img src="'+REW[k]+'" alt="">':ok?'<img src="'+GIFT+'" alt="">':'<span class="lk">🔒</span>')+'第 '+(k+1)+' 關</button>'; }
  $('menuGrid').innerHTML=h; $('menuWho').innerHTML='<b>'+esc(NAME)+'</b>，'+(nextL>=0?'接著玩第 '+(nextL+1)+' 關吧！':'全部過關了！可以再挑戰更好的成績 🎉');
  $('menuGrid').querySelectorAll('.lvb').forEach(function(b){ b.onclick=function(){ var k=+b.dataset.k; if(!unlocked(k,getPassed())) return; L=k; unlockAudio(); startGame() } });
  $('menu').classList.remove('hide');
}
function enterMenu(){
  // 從雲端讀這個人過了哪些關（換一台平板也記得）
  $('menuWho').textContent='讀取進度中…'; $('menuGrid').innerHTML=''; ['start','end','fail'].forEach(function(id){$(id).classList.add('hide')}); $('menu').classList.remove('hide');
  var merge=function(list){ var got=getPassed(); (list||[]).forEach(function(id){ var k=parseInt(String(id).replace('PY-',''),10)-1; if(k>=0&&got.indexOf(k)<0) got.push(k) }); setPassed(got); showMenu() };
  if(window.google&&google.script&&google.script.run){
    google.script.run.withSuccessHandler(merge).withFailureHandler(showMenu).pyProgress(NAME,LIMIT);
  } else {
    fetch(API+'?api=progress&name='+encodeURIComponent(NAME)+'&limit='+LIMIT).then(function(r){return r.json()}).then(merge).catch(showMenu);
  }
}
function unlockAudio(){}
function renderWho(){
  NAME=getName(); var box=$('who');
  if(NAME){ box.innerHTML='<div style="font-size:24px;margin-bottom:12px">你是 <b>'+esc(NAME)+'</b> 嗎？</div><button class="big" id="go">開始 ▶</button> <button class="ghost" id="chg">換人</button>';
    $('go').onclick=enterMenu; $('chg').onclick=function(){saveName('');renderWho()}; }
  else{ box.innerHTML='<div style="font-size:22px;margin-bottom:8px">請輸入你的名字</div><input class="name" id="nm" maxlength="20" autocomplete="off"><div style="height:12px"></div><button class="big" id="go">開始 ▶</button><div id="nmErr" style="color:var(--bad)"></div>';
    var go=function(){var v=$('nm').value.trim(); if(!v){$('nmErr').textContent='要先寫名字喔！';return} saveName(v); NAME=v; enterMenu()};
    $('go').onclick=go; $('nm').onkeydown=function(e){if(e.key==='Enter')go()}; }
}
ROWS.forEach(function(r){ r.split('').forEach(function(c){
  var b=document.createElement('button');
  if(c===' '){b.className='k gap';b.tabIndex=-1}else{b.className='k '+(INIT.indexOf(c)>=0?'s':'y');b.textContent=c;b.onclick=function(){press(c,b)}}
  $('kb').appendChild(b);
})});
$('again').onclick=function(){play(Q[i].a)};
$('again').querySelector('img').src=ICON;
$('re').onclick=function(){$('end').classList.add('hide'); startGame()};
$('toMenu').onclick=showMenu;
var quitT=null;
$('quit').onclick=function(){ var b=$('quit');
  if(!b.classList.contains('sure')){ b.classList.add('sure'); b.textContent='確定中止？'; clearTimeout(quitT); quitT=setTimeout(function(){b.classList.remove('sure'); b.textContent='⏹ 中止'},3000); return }
  clearTimeout(quitT); b.classList.remove('sure'); b.textContent='⏹ 中止';
  clearInterval(tid); over=true; busy=false; try{ if(cur){cur.onended=null; cur.pause()} }catch(e){}
  showMenu();
};
$('menuChg').onclick=function(){$('menu').classList.add('hide'); saveName(''); $('start').classList.remove('hide'); renderWho()};
$('retry').onclick=startGame;
$('nx').onclick=function(){ if(LEVELS[L+1]){ L++; startGame() } };
renderWho();
</script>
