<!DOCTYPE html>
<html>
<head>
<meta name="robots" content="noindex, nofollow">
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8ec; --ink:#2b2a35; --muted:#7a7486; --card:#ffffff; --line:#eadfc8;
  --brand:#ff8a3d; --brand2:#3fa7d6; --ok:#2fb36d; --bad:#e5484d; --slot:#fff3dd;
  --tile:clamp(82px,12.5vw,128px); --zy:clamp(26px,3.4vw,36px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
body{overscroll-behavior:none}
button{font:inherit;cursor:pointer;border:0;border-radius:14px}
.screen{display:none;min-height:100%;padding:16px}
.screen.on{display:flex;flex-direction:column}
.center{align-items:center;justify-content:center;text-align:center;gap:18px}
h1{font-size:clamp(24px,4vw,36px);margin:0}
.sub{color:var(--muted);font-size:18px}
.big{background:var(--brand);color:#fff;font-size:24px;font-weight:700;padding:14px 36px;box-shadow:0 4px 0 #d96a22}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #d96a22}
.ghostbtn{background:#fff;color:var(--ink);font-size:18px;padding:10px 22px;border:2px solid var(--line)}
input.name{font:inherit;font-size:24px;padding:12px 16px;border-radius:14px;border:3px solid var(--line);width:min(320px,80vw);text-align:center;background:#fff}
input.name:focus{outline:none;border-color:var(--brand2)}
.spin{width:54px;height:54px;border-radius:50%;border:6px solid var(--line);border-top-color:var(--brand);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.bar .t{font-weight:700;font-size:20px;flex:1;min-width:0}
.pill{background:#fff;border:2px solid var(--line);border-radius:999px;padding:4px 14px;font-size:18px;white-space:nowrap}
.timer{font-variant-numeric:tabular-nums}

/* bank */
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:calc(var(--tile) + 34px);padding:10px;border-radius:18px;background:#fff;border:2px dashed var(--line)}
.tile{width:var(--tile);border-radius:14px;background:var(--card);box-shadow:0 2px 0 var(--line),0 0 0 2px var(--line) inset;padding:5px 5px 2px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;display:flex;flex-direction:column;align-items:center}
.tile img{width:100%;aspect-ratio:1;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.tile .cap{font-size:clamp(13px,1.7vw,17px);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile.playing{box-shadow:0 0 0 3px #ffd08a,0 2px 0 var(--line)}
.tile.sel{box-shadow:0 0 0 4px var(--brand2);transform:translateY(-3px)}
.tile.dragging{opacity:.25}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%) scale(1.06);box-shadow:0 10px 24px rgba(0,0,0,.18)}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:14px;align-content:start}
.pair{min-width:0;display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px;border:2px solid var(--line);position:relative}
.slot{width:calc(var(--tile) + 6px);min-height:calc(var(--tile) + 32px);border-radius:14px;background:var(--slot);border:3px dashed #f0c98a;display:flex;align-items:center;justify-content:center;flex:none}
.slot.hot{border-color:var(--brand2);background:#e6f5fc}
.slot .tile{box-shadow:none}
.zy{flex:1;min-width:0;overflow:hidden;padding:4px 2px!important;display:flex;justify-content:center;align-items:center;min-height:calc(var(--tile) + 20px);border-radius:12px;padding:4px}
.pair.ok{border-color:var(--ok);background:#effaf3}
.pair.bad{border-color:var(--bad);background:#fdf0f0}
.mark{position:absolute;top:-12px;right:-10px;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:700;font-size:22px;display:flex;align-items:center;justify-content:center}
.ok .mark{background:var(--ok)} .bad .mark{background:var(--bad)}
.fix{position:absolute;bottom:4px;right:10px;font-size:15px;color:var(--bad)}
.sumGrid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:640px}
.sp{min-width:110px;font-size:22px;font-weight:700;padding:16px 18px;color:#fff;border-radius:16px}
.sp.ok{background:var(--ok);box-shadow:0 4px 0 #23864f}.sp.part{background:#ffb347;box-shadow:0 4px 0 #d98a1f}
.redoBox{display:none;flex-direction:column;align-items:center;gap:8px;margin-top:16px}.redoBox.on{display:flex}.redo{background:var(--brand2);box-shadow:0 4px 0 #2b7fa8}
.pnav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pbtn{background:#fff;border:2px solid var(--line);font-size:18px;padding:5px 12px;border-radius:999px}
.pbtn:disabled{opacity:.35}
.pbtn.go{background:var(--brand2);border-color:var(--brand2);color:#fff;animation:pl 1s ease-in-out infinite alternate}
@keyframes pl{to{transform:scale(1.07)}}
.pd{width:38px;height:38px;border-radius:50%;background:#fff;border:2px solid var(--line);font-size:18px;font-weight:700;padding:0}
.pd.on{border-color:var(--brand);box-shadow:0 0 0 3px #ffd9bd}
.pd.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.pd.part{background:#ffb347;border-color:#ffb347;color:#fff}
@media (max-width:900px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-aspect-ratio:1/1){:root{--tile:clamp(82px,15vw,130px)}}
@media (max-width:560px){.board{grid-template-columns:1fr}:root{--tile:84px}}

/* vertical zhuyin */
.zw{display:inline-flex;align-items:center;gap:calc(var(--zy)*.4);font-size:var(--zy);line-height:1;color:var(--ink);font-family:"PingFang TC","Heiti TC","Microsoft JhengHei","Noto Sans CJK TC","Noto Sans TC",sans-serif;font-weight:400}
.syl{display:inline-flex;flex-direction:column;align-items:center;position:relative;padding-right:.3em}
.syl .s{display:flex;align-items:center;justify-content:center;width:1.05em;height:1.18em;position:relative;line-height:1}
.syl .dot{display:flex;align-items:flex-end;justify-content:center;height:.5em;line-height:1;width:1.05em}
.syl .tn{position:absolute;left:100%;top:-.2em;font-size:.78em;line-height:1}
/* end */
.score{font-size:clamp(34px,6vw,56px);font-weight:700}
table.lb{border-collapse:collapse;width:min(520px,94vw);background:#fff;border-radius:16px;overflow:hidden;font-size:19px}
.lb th{background:#fde7cf;padding:8px;font-weight:700}
.lb td{padding:8px;border-top:1px solid var(--line)}
.lb tr.me td{background:#e6f5fc;font-weight:700}
.medal{font-size:22px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.err{color:var(--bad)}
</style>
</head>
<body>

<div id="sLoad" class="screen center on"><div class="spin"></div><div class="sub">載入中…</div></div>

<div id="sStart" class="screen center">
  <h1 id="title1"></h1>
  <div class="sub">把圖片拖到正確的注音旁邊（按住圖片會唸出詞語）</div>
  <div id="who"></div>
  <div class="row"><button class="ghostbtn" id="btnBoard1">🏆 排行榜</button></div>
</div>

<div id="sPlay" class="screen">
  <div class="bar">
    <div class="t" id="title2"></div>
    <span class="pnav"><button class="pbtn" id="pPrev">◀ 上一頁</button><span class="pnav" id="pDots"></span><button class="pbtn" id="pNext">下一頁 ▶</button></span>
    <span class="pill timer" id="tm">⏱ 0:00</span>
  </div>
  <div class="bank" id="bank"></div>
  <div class="board" id="board"></div>
  <div class="redoBox" id="redoBox"><div class="row"><button class="big redo" id="btnRedo">🔄 重做</button><button class="big" id="btnStart">▶ 開始</button><button class="ghostbtn" id="btnList">📋 回清單</button></div></div>
</div>

<div id="sSum" class="screen center">
  <h1>還有沒通過的頁</h1>
  <div class="sumGrid" id="sumGrid"></div>
  <button class="big redo" id="btnRedoAll">🔄 重做</button>
</div>

<div id="sEnd" class="screen center">
  <h1 id="title3"></h1>
  <div class="score" id="result"></div>
  <div class="sub" id="resTime"></div>
  <div id="boardBox"><div class="spin"></div></div>
  <div class="row"><button class="big" id="btnAgain">🔄 再玩一次</button></div>
</div>

<div id="sBoard" class="screen center">
  <h1>🏆 排行榜</h1>
  <div class="sub" id="title4"></div>
  <div id="boardOnly"><div class="spin"></div></div>
  <button class="ghostbtn" id="btnBack">← 回去</button>
</div>

<script>
// GitHub 版：沒有 google.script.run 時，改用網址 API 讀寫試算表
(function(){
  if(window.google&&google.script&&google.script.run) return;
  var API='https://script.google.com/macros/s/AKfycby--EOJ8CM5MtU9g-vRnhegP-bkzJqa4vcXvBpLn224qR6pLdse54OJOJEa6nJ5Wx6L/exec';
  function call(q,ok,bad,tries){ fetch(API+'?'+q).then(function(r){return r.json()}).then(ok).catch(function(e){ if((tries||0)<2) setTimeout(function(){call(q,ok,bad,(tries||0)+1)},1500); else bad&&bad(e) }) }
  function enc(o){ return Object.keys(o).map(function(k){return k+'='+encodeURIComponent(o[k])}).join('&') }
  function runner(){ var ok=function(){}, bad=function(){}; var r={
    withSuccessHandler:function(f){ok=f;return r}, withFailureHandler:function(f){bad=f;return r},
    getSet:function(id){ call(enc({api:'set',set:id}),ok,bad) },
    getLeaderboard:function(id,name){ call(enc({api:'lb',set:id,name:name||''}),ok,bad) },
    submitScore:function(id,name,c,n,s){ call(enc({api:'score',set:id,name:name,c:c,n:n,s:s}),ok,bad,2) }
  }; return r }
  window.google={script:{}}; Object.defineProperty(window.google.script,'run',{get:runner});
})();
</script>
<script>
var SET_ID = (new URLSearchParams(location.search).get('set')||'').trim();
var NAME_KEY = 'zymatch.name';
var DATA = null, NAME = '', pages = [], pageIdx = 0, correct = 0, ST = [], t0 = 0, timerId = null, selected = null;

function $(id){return document.getElementById(id)}
function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.toggle('on', s.id===id)}); window.scrollTo(0,0)}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function getName(){try{return localStorage.getItem(NAME_KEY)||''}catch(e){return ''}}
function saveName(n){try{localStorage.setItem(NAME_KEY,n)}catch(e){}}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function fmt(sec){sec=Math.round(sec);return Math.floor(sec/60)+':'+('0'+sec%60).slice(-2)}

/* ---------- 直式注音 ---------- */
var TONES='ˊˇˋ';
function zyHTML(z){
  var parts=z.split(/\s+/).filter(Boolean);
  return '<span class="zw">'+parts.map(function(s){
    var neutral=s.charAt(0)==='˙'; if(neutral) s=s.slice(1);
    var tone=''; if(TONES.indexOf(s.slice(-1))>=0){tone=s.slice(-1); s=s.slice(0,-1)}
    var ch=s.split('');
    var h='<span class="syl">'+(neutral?'<span class="dot">˙</span>':'');
    ch.forEach(function(c,i){h+='<span class="s">'+esc(c)+(i===ch.length-1&&tone?'<span class="tn">'+tone+'</span>':'')+'</span>'});
    return h+'</span>';
  }).join('')+'</span>';
}

function fitZy(){
  document.querySelectorAll('#board .zy').forEach(function(el){
    var zw=el.firstElementChild; if(!zw)return;
    zw.style.fontSize=''; zw.style.flexWrap=''; zw.style.maxWidth=''; zw.style.rowGap='';
    var base=parseFloat(getComputedStyle(zw).fontSize), n=zw.children.length;
    var availW=el.clientWidth-46, availH=el.clientHeight-8, f=base;
    zw.style.fontSize=f+'px';
    if(zw.scrollWidth>availW && n>=4){
      // 太長就分兩行（每行一半）
      var per=Math.ceil(n/2);
      var w1=zw.scrollWidth/n;               // 一個音節大約寬度
      zw.style.flexWrap='wrap'; zw.style.justifyContent='center'; zw.style.rowGap=(f*.35)+'px';
      zw.style.maxWidth=Math.ceil(w1*per+f*0.9)+'px';
    }
    for(var k=0;k<12 && (zw.scrollWidth>availW || zw.scrollHeight>availH);k++){
      var r=Math.min(availW/zw.scrollWidth, availH/zw.scrollHeight, .95);
      var nf=f*r; if(zw.style.maxWidth) zw.style.maxWidth=(parseFloat(zw.style.maxWidth)*nf/f)+'px';
      f=nf; zw.style.fontSize=f+'px'; zw.style.rowGap=(f*.35)+'px';
    }
  });
}
window.addEventListener('resize',fitZy);

/* ---------- 發音（錄好的聲音檔，按住圖片時播放） ---------- */
var AC=null, BUF={}, curSrc=null, curEl=null;
function b64ToBuf(u){var b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a.buffer}
function unlockAudio(){
  try{
    if(!AC){var C=window.AudioContext||window.webkitAudioContext; if(C) AC=new C()}
    if(AC&&AC.state==='suspended') AC.resume();
    if(AC){var s=AC.createBufferSource(); s.buffer=AC.createBuffer(1,1,22050); s.connect(AC.destination); s.start(0)}
  }catch(e){}
}
function loadAudio(list){
  list.forEach(function(it){
    if(!it.au||BUF[it.au]) return;
    BUF[it.au]='loading';
    try{
      if(!AC) throw 0;
      AC.decodeAudioData(b64ToBuf(it.au),function(buf){BUF[it.au]=buf},function(){BUF[it.au]=null});
    }catch(e){BUF[it.au]=null}
  });

function loadDing(){try{if(AC&&!DINGBUF){DINGBUF='loading';AC.decodeAudioData(b64ToBuf(DING),function(b){DINGBUF=b},function(){DINGBUF=null})}}catch(e){DINGBUF=null}}
function playDing(){
  try{
    if(AC&&DINGBUF&&DINGBUF!=='loading'){ if(AC.state==='suspended') AC.resume(); var s=AC.createBufferSource(); s.buffer=DINGBUF; s.connect(AC.destination); s.start(0) }
    else { var a=new Audio(DING); var pr=a.play(); if(pr&&pr.catch) pr.catch(function(){}) }
  }catch(e){}
}
function playWord(it){
  if(!it||!it.au) return;
  try{
    if(curSrc){try{curSrc.stop()}catch(e){} curSrc=null}
    if(curEl){curEl.pause(); curEl=null}
    var b=BUF[it.au];
    if(AC&&b&&b!=='loading'){
      if(AC.state==='suspended') AC.resume();
      var s=AC.createBufferSource(); s.buffer=b; s.connect(AC.destination); s.start(0); curSrc=s;
    }else{ curEl=new Audio(it.au); var pr=curEl.play(); if(pr&&pr.catch) pr.catch(function(){}) }
  }catch(e){}
}

/* ---------- 開始 ---------- */
function renderWho(){
  NAME=getName();
  var box=$('who');
  if(NAME){
    box.innerHTML='<div style="font-size:24px;margin-bottom:14px">你是 <b>'+esc(NAME)+'</b> 嗎？</div>'+
      '<div class="row"><button class="big" id="go">開始 ▶</button><button class="ghostbtn" id="chg">換人</button></div>';
    $('go').onclick=startGame;
    $('chg').onclick=function(){saveName('');renderWho()};
  }else{
    box.innerHTML='<div style="font-size:22px;margin-bottom:10px">請輸入你的名字</div>'+
      '<input class="name" id="nm" maxlength="20" autocomplete="off"><div style="height:14px"></div>'+
      '<button class="big" id="go">開始 ▶</button><div class="err" id="nmErr"></div>';
    var go=function(){var v=$('nm').value.trim(); if(!v){$('nmErr').textContent='要先寫名字喔！';return} saveName(v); NAME=v; startGame()};
    $('go').onclick=go; $('nm').onkeydown=function(e){if(e.key==='Enter')go()};
  }
}

function startGame(){
  unlockAudio();
  NAME=getName()||NAME;
  pages=DATA.pages.map(function(p){return p.slice()});
  loadDing();
  loadAudio(DATA.pages.reduce(function(a,p){return a.concat(p)},[]));
  ST=pages.map(function(p){return {order:shuffle(p.map(function(it,i){return i})),place:{},done:false,res:null}});
  pageIdx=0; correct=0; t0=Date.now(); $('tm').textContent='⏱ 0:00';
  clearInterval(timerId); timerId=setInterval(function(){$('tm').textContent='⏱ '+fmt((Date.now()-t0)/1000)},500);
  show('sPlay'); renderPage();
}

/* ---------- 一頁 ---------- */
function saveState(){
  var st=ST[pageIdx]; if(!st||st.done) return; st.place={};
  $('board').querySelectorAll('.pair').forEach(function(pair){var t=pair.querySelector('.slot .tile'); if(t) st.place[pair.dataset.i]=+t.dataset.i});
}
function allDone(){return ST.every(function(x){return x.done})}
function allOkAll(){return ST.every(function(x){return x.done&&x.res.every(Boolean)})}
function reviewPage(){ if(drag) return; ST[pageIdx].review=true; drawNav() }
function redoPage(){ if(drag) return; var st=ST[pageIdx]; st.review=false; st.done=false; st.res=null; st.place={}; st.order=shuffle(st.order.slice()); renderPage() }
function nextUndone(){for(var k=1;k<=pages.length;k++){var j=(pageIdx+k)%pages.length; if(!ST[j].done) return j} for(k=1;k<=pages.length;k++){j=(pageIdx+k)%pages.length; if(!ST[j].res.every(Boolean)) return j} return -1}
function gotoPage(k){ if(k<0||k>=pages.length||k===pageIdx&&$('board').children.length) return; if(drag) return; saveState(); pageIdx=k; renderPage() }
function drawNav(){
  var h=''; ST.forEach(function(x,k){ var c=x.done?(x.res.every(Boolean)?' ok':' part'):''; h+='<button class="pd'+c+(k===pageIdx?' on':'')+'" data-k="'+k+'">'+(k+1)+'</button>' });
  $('pDots').innerHTML=h;
  $('pDots').querySelectorAll('.pd').forEach(function(b){b.onclick=function(){gotoPage(+b.dataset.k)}});
  $('pPrev').disabled=pageIdx===0; $('pNext').disabled=pageIdx===pages.length-1;
  var st=ST[pageIdx], bad=ST.filter(function(x){return x.done&&!x.res.every(Boolean)}).length;
  $('redoBox').classList.toggle('on', st.done);
  $('btnList').style.display=(allDone()&&!allOkAll()&&!st.review)?'':'none';
  $('btnRedo').style.display=st.review?'none':''; $('btnStart').style.display=st.review?'':'none';
}
function renderPage(){
  var p=pages[pageIdx], st=ST[pageIdx]; selected=null;
  var bank=$('bank'), board=$('board'); bank.innerHTML=''; board.innerHTML=''; board.classList.toggle('done',st.done);
  var used={}; Object.keys(st.place).forEach(function(k){used[st.place[k]]=1});
  st.order.forEach(function(i){ if(!used[i]) bank.appendChild(makeTile(p[i],i)) });
  p.forEach(function(it,i){
    var pair=document.createElement('div'); pair.className='pair'; pair.dataset.i=i;
    pair.innerHTML='<div class="slot"></div><div class="zy">'+zyHTML(it.z)+'</div>';
    var slot=pair.querySelector('.slot'); slot.addEventListener('click',function(){onSlotTap(this)});
    if(st.place[i]!=null) slot.appendChild(makeTile(p[st.place[i]],st.place[i]));
    if(st.done){ var ok=st.res[i]; pair.classList.add(ok?'ok':'bad'); pair.insertAdjacentHTML('beforeend','<div class="mark">'+(ok?'✓':'✗')+'</div>'+(ok?'':'<div class="fix">答案：'+esc(it.w)+'</div>')) }
    board.appendChild(pair);
  });
  drawNav(); fitZy();
}

function makeTile(it,i){
  var t=document.createElement('div'); t.className='tile'; t.dataset.i=i;
  t.innerHTML=(it.img?'<img src="'+it.img+'" alt="">':'')+'<div class="cap">'+esc(it.w)+'</div>';
  attachDrag(t); return t;
}

function locked(){return $('board').classList.contains('done')}

function place(tile,slot){
  if(locked())return;
  if(slot){
    var cur=slot.querySelector('.tile');
    if(cur&&cur!==tile){var from=tile.parentElement; if(from&&from.classList.contains('slot')) from.appendChild(cur); else $('bank').appendChild(cur)}
    slot.appendChild(tile);
  }else $('bank').appendChild(tile);
  setSel(null); checkFull();
}
function setSel(t){if(selected)selected.classList.remove('sel'); selected=t; if(t)t.classList.add('sel')}
function onSlotTap(slot){
  if(locked())return;
  if(selected){place(selected,slot);return}
}
function onTileTap(t){
  if(locked())return;
  if(t.parentElement.classList.contains('slot')&&!selected){place(t,null);return}
  if(selected===t){setSel(null);return}
  if(selected&&t.parentElement.classList.contains('slot')){place(selected,t.parentElement);return}
  setSel(t);
}

/* 拖曳（手指和滑鼠都可以） */
var drag=null;
function targetSlot(x,y,ghost){
  // 1) 手指/滑鼠所在的卡片
  var el=document.elementFromPoint(x,y), pair=el&&el.closest('.pair');
  if(pair) return pair.querySelector('.slot');
  // 2) 圖片和哪個格子重疊最多（只要有一部分進去就算）
  if(!ghost) return null;
  var g=ghost.getBoundingClientRect(), best=null, bestA=0;
  document.querySelectorAll('#board .slot').forEach(function(s){
    var r=s.getBoundingClientRect();
    var w=Math.min(g.right,r.right)-Math.max(g.left,r.left), h=Math.min(g.bottom,r.bottom)-Math.max(g.top,r.top);
    if(w>0&&h>0&&w*h>bestA){bestA=w*h;best=s}
  });
  return bestA>(g.width*g.height*0.12)?best:null;
}
function endDrag(ev,cancel){
  var d=drag; if(!d) return; drag=null;
  document.removeEventListener('pointermove',onDragMove,true);
  document.removeEventListener('pointerup',onDragUp,true);
  document.removeEventListener('pointercancel',onDragCancel,true);
  window.removeEventListener('blur',onDragCancel);
  if(d.hot) d.hot.classList.remove('hot');
  var t=d.tile;
  if(!d.ghost){ if(!cancel) onTileTap(t); return; }
  var x=ev&&ev.clientX!=null?ev.clientX:d.lx, y=ev&&ev.clientY!=null?ev.clientY:d.ly;
  var slot=cancel?d.hot:targetSlot(x,y,d.ghost);
  var el=document.elementFromPoint(x,y), inBank=el&&el.closest('.bank');
  d.ghost.remove(); t.classList.remove('dragging');
  document.querySelectorAll('.ghost').forEach(function(g){g.remove()});
  if(slot) place(t,slot); else if(inBank) place(t,null);
}
function onDragMove(ev){
  var d=drag; if(!d||ev.pointerId!==d.id) return;
  ev.preventDefault();
  d.lx=ev.clientX; d.ly=ev.clientY;
  if(!d.ghost){
    if(Math.abs(ev.clientX-d.sx)+Math.abs(ev.clientY-d.sy)<8) return;
    var g=d.tile.cloneNode(true); g.classList.add('ghost'); g.classList.remove('sel');
    g.style.width=d.tile.offsetWidth+'px'; document.body.appendChild(g); d.ghost=g;
    d.tile.classList.add('dragging'); setSel(null);
  }
  d.ghost.style.left=ev.clientX+'px'; d.ghost.style.top=ev.clientY+'px';
  var s=targetSlot(ev.clientX,ev.clientY,d.ghost);
  if(d.hot!==s){ if(d.hot)d.hot.classList.remove('hot'); d.hot=s; if(s)s.classList.add('hot'); }
}
function onDragUp(ev){ if(drag&&ev.pointerId===drag.id) endDrag(ev,false); }
function onDragCancel(ev){ if(drag) endDrag(ev&&ev.clientX!=null?ev:null,true); }
function attachDrag(t){
  t.addEventListener('pointerdown',function(e){
    if(locked())return;
    if(drag) endDrag(null,true);
    document.querySelectorAll('.ghost').forEach(function(g){g.remove()});
    document.querySelectorAll('.tile.dragging').forEach(function(x){x.classList.remove('dragging')});
    e.preventDefault();
    var p=pages[pageIdx]; if(p) playWord(p[+t.dataset.i]);
    drag={tile:t,id:e.pointerId,sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,ghost:null,hot:null};
    document.addEventListener('pointermove',onDragMove,true);
    document.addEventListener('pointerup',onDragUp,true);
    document.addEventListener('pointercancel',onDragCancel,true);
    window.addEventListener('blur',onDragCancel);
  });
}
// 保險：滑鼠在畫面外放開、或任何意外情況，都把卡住的圖片收好
document.addEventListener('mouseup',function(ev){ if(drag) setTimeout(function(){ if(drag) endDrag(ev,false); },0); },true);
document.addEventListener('touchend',function(ev){ if(drag) setTimeout(function(){ if(drag){ var t=ev.changedTouches&&ev.changedTouches[0]; endDrag(t?{clientX:t.clientX,clientY:t.clientY}:null,false);} },0); },true);
document.addEventListener('mouseleave',function(){ if(drag&&drag.ghost) endDrag(null,true); });

function checkFull(){
  var slots=document.querySelectorAll('#board .slot');
  for(var i=0;i<slots.length;i++) if(!slots[i].querySelector('.tile')) return;
  var me=pageIdx; setTimeout(function(){ if(pageIdx===me) markPage() },250);
}

function firstUndone(){for(var j=0;j<pages.length;j++){var k=(pageIdx+1+j)%pages.length; if(!ST[k].done||ST[k].review) return k} return -1}
function afterPage(){
  if(allOkAll()) return finish();
  var k=firstUndone();
  if(k>=0) gotoPage(k); else showSum();
}
function showSum(){
  saveState();
  var h=''; ST.forEach(function(x,k){ var ok=x.res.every(Boolean); h+='<button class="sp '+(ok?'ok':'part')+'" data-k="'+k+'">第 '+(k+1)+' 頁<br>'+(ok?'✓':'✗')+'</button>' });
  $('sumGrid').innerHTML=h;
  $('sumGrid').querySelectorAll('.sp').forEach(function(b){b.onclick=function(){show('sPlay'); pageIdx=+b.dataset.k; renderPage()}});
  show('sSum');
}
function redoAll(){
  var first=-1;
  ST.forEach(function(st,k){ if(!st.res.every(Boolean)){ st.review=true; if(first<0) first=k } });
  show('sPlay'); pageIdx=first<0?0:first; renderPage();
}
function markPage(){
  var board=$('board'); if(board.classList.contains('done'))return;
  board.classList.add('done'); saveState();
  var me=pageIdx, st=ST[me], p=pages[me], pairs=[].slice.call(board.querySelectorAll('.pair')), k=0;
  st.done=true; st.res=pairs.map(function(pair){var t=pair.querySelector('.slot .tile'); return !!t&&+t.dataset.i===+pair.dataset.i});
  var allOk=st.res.every(Boolean), fin=allOkAll();
  if(fin) clearInterval(timerId);
  // 一個一個打勾：答對播答對音效，答錯不出聲
  (function step(){
    if(pageIdx!==me) return;
    if(k>=pairs.length){
      drawNav();
      setTimeout(function(){ if(pageIdx!==me||ST[me].review||!$('sPlay').classList.contains('on')) return; afterPage() },1200);
      return;
    }
    var pair=pairs[k], ok=st.res[k]; k++;
    pair.classList.add(ok?'ok':'bad');
    pair.insertAdjacentHTML('beforeend','<div class="mark">'+(ok?'✓':'✗')+'</div>'+(ok?'':'<div class="fix">答案：'+esc(p[+pair.dataset.i].w)+'</div>'));
    if(ok) playDing();
    setTimeout(step,380);
  })();
}

/* ---------- 結果與排行榜 ---------- */
function finish(){
  var sec=(Date.now()-t0)/1000, total=DATA.total; correct=total;
  $('result').textContent='全部答對 🎉';
  $('resTime').textContent='用時 '+fmt(sec);
  $('boardBox').innerHTML='<div class="spin"></div><div class="sub">儲存成績中…</div>';
  show('sEnd');
  var tries=0;
  (function send(){
    google.script.run.withSuccessHandler(function(lb){$('boardBox').innerHTML=lbHTML(lb,NAME)})
      .withFailureHandler(function(){ if(++tries<3) setTimeout(send,1500); else $('boardBox').innerHTML='<div class="err">成績沒有存到（網路有問題），請再玩一次。</div>'})
      .submitScore(SET_ID,NAME,correct,total,sec);
  })();
}

function lbHTML(lb,me){
  if(!lb||!lb.top.length) return '<div class="sub">還沒有人上榜，快來當第一名！</div>';
  var m=(me||'').toLowerCase(), medals=['🥇','🥈','🥉'];
  var h='<table class="lb"><tr><th>名次</th><th>名字</th><th>時間</th></tr>';
  lb.top.slice(0,5).forEach(function(r){
    h+='<tr class="'+(r.name.toLowerCase()===m?'me':'')+'"><td>'+(r.rank<=3?'<span class="medal">'+medals[r.rank-1]+'</span>':r.rank)+'</td><td>'+esc(r.name)+'</td><td>'+fmt(r.s)+'</td></tr>';
  });
  h+='</table>';
  if(lb.mine&&lb.mine.rank>5) h+='<div class="sub" style="margin-top:10px">你的最好成績：第 '+lb.mine.rank+' 名（'+fmt(lb.mine.s)+'）</div>';
  return h;
}

function showBoard(){
  show('sBoard'); $('boardOnly').innerHTML='<div class="spin"></div>';
  google.script.run.withSuccessHandler(function(lb){$('boardOnly').innerHTML=lbHTML(lb,getName())})
    .withFailureHandler(function(){$('boardOnly').innerHTML='<div class="err">讀不到排行榜，請稍後再試。</div>'}).getLeaderboard(SET_ID,getName());
}

$('btnRedo').onclick=reviewPage;
$('btnStart').onclick=redoPage;
$('btnRedoAll').onclick=redoAll;
$('btnList').onclick=showSum;
$('pPrev').onclick=function(){gotoPage(pageIdx-1)};
$('pNext').onclick=function(){gotoPage(pageIdx+1)};
$('btnAgain').onclick=function(){show('sStart');renderWho()};
$('btnBoard1').onclick=showBoard;
$('btnBack').onclick=function(){show('sStart');renderWho()};

/* ---------- 載入 ---------- */
google.script.run.withSuccessHandler(function(d){
  if(!d||!d.pages||!d.pages.length){$('sLoad').innerHTML='<div class="sub">找不到這個遊戲（'+esc(SET_ID||'沒有指定課次')+'）。<br>請跟老師說。</div>';return}
  DATA=d; ['title1','title2','title3','title4'].forEach(function(id){$(id).textContent=d.title});
  document.title=d.title+' 注音配對';
  show('sStart'); renderWho();
}).withFailureHandler(function(){$('sLoad').innerHTML='<div class="sub err">載入失敗，請重新整理頁面。</div>'}).getSet(SET_ID);
</script>
